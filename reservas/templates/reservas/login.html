{% extends "base.html" %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <div class="text-center" style="font-size:1.6rem; color:var(--primary); margin-bottom:.4rem;">
            <i class="bi bi-shield-lock"></i>
        </div>
        <h2 class="auth-title">Iniciar sesión</h2>
        <p class="auth-sub">Accede para reservar y gestionar tus pistas.</p>

        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label for="username">Usuario</label>
                <input id="username" type="text" name="username" placeholder="Tu usuario" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <input id="password" type="password" name="password" placeholder="Tu contraseña" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-block">
                <i class="bi bi-box-arrow-in-right"></i> Entrar
            </button>
        </form>

        <p class="small muted text-center mt-1 mb-0">
            <a href="{% url 'home' %}"><i class="bi bi-arrow-left"></i> Volver al inicio</a>
        </p>
    </div>
</div>
{% endblock %}
